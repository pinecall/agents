packages:
  - examples/*
  # The wire, from the repo next door: one contract, two languages, its own version. A path
  # today because nothing is published yet; a range in package.json the day it is.
  - ../protocol/typescript

# tsx is the tenant CLI's TypeScript loader; esbuild is its compiler, and it builds a binary.
allowBuilds:
  esbuild: true

# Our own wire, published by us: the release-age wait guards against somebody else's package.
minimumReleaseAgeExclude:
  - '@pinecall/protocol'

# The wire is the checkout next door until it is published: link it, never the registry copy.
linkWorkspacePackages: true
